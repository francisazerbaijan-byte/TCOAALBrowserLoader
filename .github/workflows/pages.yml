name: Publish website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app/**"
      - "LICENSE"
      - "NOTICE.md"
      - "CNAME"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare public website
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R app _site/app
          cp LICENSE _site/LICENSE
          cp NOTICE.md _site/NOTICE.md
          touch _site/.nojekyll
          # Do not copy the upstream CNAME: this fork uses a GitHub Pages project URL.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
